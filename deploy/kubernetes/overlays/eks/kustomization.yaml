# EKS: image from ECR, Bedrock via IRSA (IAM role for the ServiceAccount). No LLM key.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saf3ai-agent

resources:
  - ../../base
  # Using EKS Pod Identity instead of IRSA? Uncomment (allows egress to the Pod Identity Agent).
  # - networkpolicy-pod-identity.yaml

images:
  - name: saf3ai-sample-agent
    newName: <ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/saf3ai-sample-agent
    newTag: "1.0.0"

configMapGenerator:
  - name: saf3ai-agent-config
    namespace: saf3ai-agent
    behavior: merge
    literals:
      - LLM_PROVIDER=bedrock
      - LLM_MODEL=<BEDROCK_MODEL_OR_INFERENCE_PROFILE_ID>
      - AWS_REGION=<AWS_REGION>

# IRSA. With EKS Pod Identity, delete this patch (the association is made with the AWS CLI).
patches:
  - target:
      kind: ServiceAccount
      name: saf3ai-agent
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: saf3ai-agent
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/saf3ai-agent-bedrock
