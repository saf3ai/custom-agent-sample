# GKE Workload Identity gets tokens from the GKE metadata server. The base
# NetworkPolicy only allows DNS + 443, so allow the metadata server too:
#   169.254.169.252:988 - clusters without Dataplane V2
#   169.254.169.254:80  - clusters with Dataplane V2
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saf3ai-agent-gke-metadata
  labels:
    app.kubernetes.io/name: saf3ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: saf3ai-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
