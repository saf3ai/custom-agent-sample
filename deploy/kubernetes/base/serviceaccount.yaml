apiVersion: v1
kind: ServiceAccount
metadata:
  name: saf3ai-agent
  labels:
    app.kubernetes.io/name: saf3ai-agent
  # The cloud identity annotation is added by each overlay:
  #   eks -> eks.amazonaws.com/role-arn        (IRSA, for Bedrock)
  #   aks -> azure.workload.identity/client-id (Azure Workload Identity)
  #   gke -> iam.gke.io/gcp-service-account    (GKE Workload Identity, for Vertex AI)
